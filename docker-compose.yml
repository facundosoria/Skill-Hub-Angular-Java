# Stack de produccion de Skill Hub (Angular + Spring Boot).
# Reemplaza al stack Next.js. El túnel/proxy del host apunta a 127.0.0.1:8087.
#
#   db            -> postgres:16-alpine, mismo volumen que el stack viejo (datos intactos)
#   hydra-migrate -> corre una vez, aplica el schema de Hydra sobre la base "hydra"
#   hydra         -> Ory Hydra (OAuth 2.1 para /api/mcp, ver plan de OAuth). Su
#                    puerto publico (4444) se proxea via web/Caddy; su puerto
#                    admin (4445) NUNCA se expone, solo lo habla `backend` por
#                    la red interna de docker.
#   backend       -> Spring Boot :8080 (solo red interna). Flyway con baseline en V12.
#   web           -> Caddy: sirve el bundle Angular y proxea /api -> backend:8080
#                    y /oauth2, /.well-known, /userinfo -> hydra:4444.
#                    Único puerto publicado: 127.0.0.1:8087.
#
# La base "hydra" no se crea sola: pgdata es un volumen ya inicializado, asi
# que /docker-entrypoint-initdb.d no vuelve a correr. Antes del primer deploy
# con Hydra, crear a mano una sola vez (EN DOS COMANDOS SEPARADOS: CREATE
# DATABASE no puede correr dentro de una transaccion, y psql -c "a; b" manda
# ambas sentencias como una sola transaccion implicita - juntas, la segunda
# hace fallar y revertir tambien a la primera, sin avisar con claridad):
#   docker compose exec db psql -U ${POSTGRES_USER:-skillhub} -c \
#     "CREATE ROLE hydra LOGIN PASSWORD '<HYDRA_DB_PASSWORD>';"
#   docker compose exec db psql -U ${POSTGRES_USER:-skillhub} -c \
#     "CREATE DATABASE hydra OWNER hydra;"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillhub}
      POSTGRES_DB: ${POSTGRES_DB:-skillhub}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillhub} -d ${POSTGRES_DB:-skillhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?falta HYDRA_DB_PASSWORD, ver .env.example}@db:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]

  hydra:
    image: oryd/hydra:v2.2.0
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:${HYDRA_DB_PASSWORD:?falta HYDRA_DB_PASSWORD, ver .env.example}@db:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/
      URLS_LOGIN: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/oauth/login
      URLS_CONSENT: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/oauth/consent
      URLS_LOGOUT: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/oauth/logout
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?falta HYDRA_SYSTEM_SECRET, ver .env.example}
      OAUTH2_EXPOSE_INTERNAL_ERRORS: "false"
      OAUTH2_EXPIRATION_ACCESS_TOKEN: "1h"
      OAUTH2_EXPIRATION_ID_TOKEN: "1h"
      OAUTH2_EXPIRATION_REFRESH_TOKEN: "720h"
      OAUTH2_EXPIRATION_LOGIN_CONSENT_REQUEST: "1h"
      STRATEGIES_ACCESS_TOKEN: "jwt"
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: "public"
      # Confirmado corriendo hydra:v2.2.0 en local (probando distintas claves
      # contra la instancia real): esta es la que habilita DCR publica de
      # verdad, sin pedir un registration access token previo.
      OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED: "true"
      # Perfil esperado para DCR de clientes MCP: authorization_code +
      # refresh_token y cliente publico sin secreto. Hydra exige PKCE para
      # estos clientes; el cliente debe enviar token_endpoint_auth_method=none
      # en el registro.
      OAUTH2_PKCE_ENFORCED_FOR_PUBLIC_CLIENTS: "true"
      OIDC_DYNAMIC_CLIENT_REGISTRATION_DEFAULT_SCOPE: "openid offline_access mcp"
      WEBFINGER_OIDC_DISCOVERY_SUPPORTED_SCOPE: "mcp"
      STRATEGIES_SCOPE: "exact"
      # Hydra v2.2 defaults JWT scopes to `scp` (array); emit both forms so
      # standard resource servers can consume the RFC 9068 `scope` string too.
      STRATEGIES_JWT_SCOPE_CLAIM: "both"
      SERVE_PUBLIC_CORS_ENABLED: "true"
      # El frontend y Hydra se consumen por el mismo origen publico; no abrir
      # CORS globalmente. PUBLIC_BASE_URL debe ser solo scheme://host[:port].
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}
      SERVE_ADMIN_CORS_ENABLED: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}
      # auto activa --dev solo para un issuer HTTP local; produccion HTTPS usa
      # `serve all` sin --dev. Puede forzarse true/false en el .env local.
      HYDRA_DEV_MODE: ${HYDRA_DEV_MODE:-auto}
      LOG_LEVEL: info
    command: ["sh", "-c", "case \"$${HYDRA_DEV_MODE}:$${PUBLIC_BASE_URL}\" in true:*|auto:http://*) exec hydra serve all --dev ;; *) exec hydra serve all ;; esac"]
    ports:
      # Solo para debug local, mismo criterio que db expone 5432. El puerto
      # admin (4445) NUNCA se publica aca.
      - "127.0.0.1:4444:4444"
    healthcheck:
      # "hydra get version" solo imprime la version del binario CLI, nunca
      # llega a tocar el servidor -> reporta "healthy" aunque Hydra todavia no
      # este atendiendo requests. /health/ready es el endpoint real de
      # Hydra para esto; wget viene en la imagen (alpine/busybox).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4444/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skillhub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-skillhub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-skillhub}
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET, ver .env.example}
      APP_TZ: ${APP_TZ:-America/Argentina/Cordoba}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      # Base de prod: ya tiene el schema de Drizzle (== V1..V12) sin
      # flyway_schema_history. Se marca la linea base en V12 y no se aplica nada.
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "12"
      # OAuth 2.1 para /api/mcp via Hydra (ver plan de OAuth). jwks-uri/admin-url
      # usan el DNS interno de docker; issuer/mcp-resource-url son las URLs
      # publicas y deben coincidir con URLS_SELF_ISSUER de arriba y con lo que
      # proxea Caddy. PUBLIC_BASE_URL (mismo default que arriba) permite correr
      # todo el stack en local (ej. PUBLIC_BASE_URL=http://localhost:8087 en tu
      # .env local) antes de subirlo al server con el dominio real.
      HYDRA_ISSUER: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/
      HYDRA_JWKS_URI: http://hydra:4444/.well-known/jwks.json
      HYDRA_ADMIN_URL: http://hydra:4445
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_MCP_RESOURCE_URL: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/api/mcp
      HYDRA_PROTECTED_RESOURCE_METADATA_URL: ${PUBLIC_BASE_URL:-https://marketplace-utn.tech}/.well-known/oauth-protected-resource
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8080"

volumes:
  pgdata:
