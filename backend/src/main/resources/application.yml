spring:
  application:
    name: skill-hub-backend
  datasource:
    # Equivalente a DATABASE_URL del proyecto Next. En Docker/prod se pasa por env:
    #   SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillhub}
    username: ${SPRING_DATASOURCE_USERNAME:skillhub}
    password: ${SPRING_DATASOURCE_PASSWORD:skillhub}
    hikari:
      # Cada conexion del pool arranca en la zona de la organizacion, para que
      # CURRENT_DATE en las lecturas de telemetria sea el dia local y no el del
      # servidor. Equivale a connection.TimeZone del pool postgres-js del original.
      connection-init-sql: SET TIME ZONE 'America/Argentina/Cordoba'
  flyway:
    enabled: true
    locations: classpath:db/migration
    # En la base de prod (ya con el schema de Drizzle) se arranca con
    # FLYWAY_BASELINE_ON_MIGRATE=true / FLYWAY_BASELINE_VERSION=12 para que Flyway
    # marque la linea base en V12 y no reaplique V1..V12. En una base limpia
    # (tests, dev) los defaults dejan que se apliquen todas.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

# Zona de la organizacion: las lecturas de telemetria usan CURRENT_DATE y tienen
# que dar el dia local, no el del servidor. Equivale a connection.TimeZone del
# pool de postgres-js en src/server/db/index.ts (APP_TZ).
app:
  timezone: ${APP_TZ:America/Argentina/Cordoba}
  usage:
    retention-days: ${USAGE_RETENTION_DAYS:90}
  # Infra monitoring (feature: infra-monitor). Disabled by default: Skill Hub
  # starts without any registry/eureka reachability and no network call happens
  # at startup. Every knob below is externally configurable. The probe
  # destination allowlist (allowed-hosts / allowed-ports) is mandatory before a
  # registry-derived target is ever fetched.
  infra:
    enabled: ${INFRA_ENABLED:false}
    eureka-url: ${INFRA_EUREKA_URL:}
    interval: ${INFRA_INTERVAL:30s}
    connect-timeout: ${INFRA_CONNECT_TIMEOUT:2s}
    read-timeout: ${INFRA_READ_TIMEOUT:3s}
    max-concurrency: ${INFRA_MAX_CONCURRENCY:4}
    failure-threshold: ${INFRA_FAILURE_THRESHOLD:3}
    recovery-threshold: ${INFRA_RECOVERY_THRESHOLD:2}
    degrade-latency: ${INFRA_DEGRADE_LATENCY:1500ms}
    stale-observation-grace: ${INFRA_STALE_GRACE:90s}
    retention-days: ${INFRA_RETENTION_DAYS:90}
    availability-window24h: ${INFRA_WINDOW_24H:24h}
    availability-window7d: ${INFRA_WINDOW_7D:7d}
    allowed-schemes:
      - http
      - https
    allowed-hosts: ${INFRA_ALLOWED_HOSTS:}
    allowed-ports: ${INFRA_ALLOWED_PORTS:8000,8001,8080,8081,8082,8083,8084,8085,8086,8087,8088,8090,8761,9090}
    paths:
      health: /actuator/health
      prometheus: /actuator/prometheus
    # Optional frontend-edge node listing through the Tailscale API. Pending:
    # requires credentials and an agreed device/tag contract, so it stays
    # disabled and reports an unavailable state rather than simulated nodes.
    tailscale:
      enabled: ${INFRA_TAILSCALE_ENABLED:false}
      api-url: ${INFRA_TAILSCALE_API_URL:https://api.tailscale.com}
      tailnet: ${INFRA_TAILSCALE_TAILNET:}
      api-key: ${INFRA_TAILSCALE_API_KEY:}
      tag-filter: tag:frontend-edge
  # Secreto de la cookie de sesion (jose HS256 en el original). >= 32 chars.
  session-secret: ${SESSION_SECRET:dev-only-session-secret-change-me-32c}
  # secure=true en la cookie solo en prod (el original mira NODE_ENV).
  cookie-secure: ${COOKIE_SECURE:false}
  # OAuth 2.1 para /api/mcp via Ory Hydra self-hosteado (ver plan de OAuth).
  # jwks-uri/admin-url apuntan al contenedor hydra por la red interna de
  # docker; issuer/mcp-resource-url/protected-resource-metadata-url son las
  # URLs publicas que ven los clientes (deben coincidir con URLS_SELF_ISSUER
  # de Hydra y con como Caddy proxea /oauth2/* y /.well-known/*).
  hydra:
    issuer: ${HYDRA_ISSUER:https://marketplace-utn.tech/}
    jwks-uri: ${HYDRA_JWKS_URI:http://hydra:4444/.well-known/jwks.json}
    admin-url: ${HYDRA_ADMIN_URL:http://hydra:4445}
    # Puerto publico de Hydra por la red interna de docker (no el issuer
    # publico): lo usa el backend para pedirle su /.well-known/openid-configuration
    # real y reenviarla en /.well-known/oauth-authorization-server, que Hydra
    # v2 no expone directamente (confirmado corriendo el stack en local).
    public-url: ${HYDRA_PUBLIC_URL:http://hydra:4444}
    mcp-resource-url: ${HYDRA_MCP_RESOURCE_URL:https://marketplace-utn.tech/api/mcp}
    protected-resource-metadata-url: ${HYDRA_PROTECTED_RESOURCE_METADATA_URL:https://marketplace-utn.tech/.well-known/oauth-protected-resource}

logging:
  level:
    org.flywaydb: info
